name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py

      - name: Run unit tests (no network)
        run: python3 -m unittest discover -s tests -v

      - name: Validate metadata and fallback list
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path("version.json").read_text())
          assert v["name"] == "free-models-only"
          assert v["version"].startswith("2.")
          ids = [line.strip() for line in Path("references/paid-model-ids.txt").read_text().splitlines()
                 if line.strip() and not line.startswith("#")]
          assert len(ids) > 50
          print("OK:", len(ids), "fallback ids, version", v["version"])
          PY

      - name: Dry-run on a sample config
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/opencode.jsonc" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/deepseek-v4.1-flash-free",
            // >>> free-models-only: START (managed — do not edit manually)
            // <<< free-models-only: END
            "shell": "/bin/bash"
          }
          EOF
          python3 scripts/apply.py --config "$tmp/opencode.jsonc" \
            --paid-file references/paid-model-ids.txt --dry-run
